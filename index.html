tion>"},{type:"callout",title:"不要依字體大小挑標籤",paragraphs:["h2 看起來太大，應由 CSS 改小，而不是跳去 h4。標題層級描述內容關係。"],bullets:[],tone:"key"},{type:"exercise",title:"建立文章大綱",task:"寫一個 h1、兩個 h2，每個 h2 下面至少一個 h3 與 p。",checklist:["只有一個頁面 h1。","層級沒有跳號。","段落使用 p。"]}],sources:[{label:"HTML Headings",url:"https://www.w3schools.com/html/html_headings.asp"},{label:"HTML Paragraphs",url:"https://www.w3schools.com/html/html_paragraphs.asp"},{label:"HTML Formatting",url:"https://www.w3schools.com/html/html_formatting.asp"}]},{id:"html-links-paths",title:"連結、導覽、錨點與檔案路徑",shortTitle:"連結與路徑",summary:"連結讓網站頁面彼此連接；同時學會相對路徑、頁內錨點與新分頁的安全寫法。",duration:"約 20–30 分鐘",objectives:["建立外部、內部與頁內連結。","理解同層、子資料夾、父資料夾路徑。","新分頁連結加 rel。"],sections:[{type:"code",title:"常用連結",language:"html",code:'<nav aria-label="主要導覽">\n  <a href="#about">關於我</a>\n  <a href="posts.html">文章</a>\n  <a href="pages/contact.html">聯絡</a>\n  <a href="https://example.com" target="_blank" rel="noopener noreferrer">外部作品（新分頁）</a>\n</nav>'},{type:"table",title:"相對路徑",headers:["目前位置與目標","寫法","意思"],rows:[["同一資料夾","`styles.css`","直接寫檔名。"],["子資料夾","`images/photo.jpg`","進入 images。"],["上一層","`../index.html`","回父資料夾。"],["頁內 id","`#contact`","跳到 id=contact。"]],intro:null,note:null,firstColumnHeader:!0,caption:null},{type:"callout",title:"連結文字要有目的",paragraphs:['避免只寫「點這裡」。寫「查看完整作品」能讓使用者與搜尋工具知道目的。`target="_blank"` 時應告知新分頁並加 rel。'],bullets:[],tone:"tip"},{type:"exercise",title:"畫出路徑",task:"index.html 在根目錄，photo.jpg 在 images，contact.html 在 pages。寫出從 index 到兩者的 href/src。",checklist:[],answerCode:'<img src="images/photo.jpg" alt="...">\n<a href="pages/contact.html">聯絡</a>',language:"html"}],sources:[{label:"HTML Links",url:"https://www.w3schools.com/html/html_links.asp"},{label:"HTML File Paths",url:"https://www.w3schools.com/html/html_filepaths.asp"}]},{id:"html-images",title:"圖片、alt 與 figure",shortTitle:"圖片",summary:"圖片不只是 src；還要提供尺寸、替代文字，以及在需要時用 figure／figcaption 說明。",duration:"約 20–30 分鐘",objectives:["使用 img、src、alt、width、height。","分辨資訊圖與裝飾圖 alt。","使用 figure 與 figcaption。"],sections:[{type:"table",title:"alt 寫法",headers:["圖片角色","alt","例子"],rows:[["有資訊","描述在此處必要的內容。",'`alt="王小明在工作坊示範網頁排版"`'],["功能圖片","描述動作或目的。","首頁 logo 連結可寫網站名稱。"],["純裝飾","空字串。",'`alt=""`'],["已由鄰近文字完整說明","通常可空 alt。","避免重複朗讀。"]],intro:null,note:null,firstColumnHeader:!0,caption:null},{type:"text",title:"figure 與 figcaption",paragraphs:["當圖片、圖表或程式碼範例能視為一個可獨立引用的內容單元時，可用 `figure` 包住它；若只是版面裝飾，不必為了排版硬套 `figure`。","`figcaption` 是這個內容單元的可見圖說，可放在 `figure` 內的第一個或最後一個位置。它不會取代 `img` 的 `alt`：alt 在圖片無法看見時替代圖片資訊，figcaption 則讓所有使用者看到補充背景、來源或說明。"],bullets:["一個 `figure` 最多使用一個 `figcaption`。","沒有圖說時可以只有 `figure`；內容不具獨立意義時也可以直接使用 `img`。"],ordered:!1},{type:"code",title:"圖片與圖說",language:"html",code:'<figure>\n  <img src="images/workshop.jpg"\n       alt="三位學員在筆電前練習 HTML"\n       width="1200" height="800">\n  <figcaption>2026 夏季網頁入門工作坊</figcaption>\n</figure>'},{type:"callout",title:"不要把檔名當 alt",paragraphs:['`alt="IMG_1234.jpg"` 或 `alt="圖片"` 幾乎沒有資訊。alt 要替代圖片在這個情境的功能。'],bullets:[],tone:"warning"},{type:"exercise",title:"判斷 alt",task:"替個人照、裝飾波浪、技能圖表各寫 alt。",checklist:[],answerText:"個人照描述人物；裝飾波浪用空 alt；技能圖表描述圖表的關鍵結論，或在鄰近文字完整呈現後使用空 alt。"}],sources:[{label:"HTML Images",url:"https://www.w3schools.com/html/html_images.asp"},{label:"HTML figure",url:"https://www.w3schools.com/tags/tag_figure.asp"}]},{id:"html-lists-semantics",title:"清單、群組與語意化版面",shortTitle:"清單與語意",summary:"先用 ul／ol／dl 表達清單，再用 header、nav、main、section、article、aside、footer 建立可理解的頁面骨架。",duration:"約 20–30 分鐘",objectives:["選擇 ul、ol、dl。","使用主要 semantic elements。","知道 div／span 是無特定語意的通用容器。"],sections:[{type:"table",title:"清單選擇",headers:["元素","適用情境","例子"],rows:[["`ul`","順序不重要。","技能、導覽。"],["`ol`","順序或排名重要。","教學步驟。"],["`dl`","名稱與描述配對。","履歷基本資料。"]],intro:null,note:null,firstColumnHeader:!0,caption:null},{type:"table",title:"語意化元素",headers:["元素","角色","常見內容"],rows:[["`header`","頁面或章節開頭。","品牌、標題。"],["`nav`","主要導覽連結。","網站選單。"],["`main`","本頁獨有主要內容。","一般每頁一個。"],["`section`","有主題的章節。","通常有標題。"],["`article`","可獨立散布內容。","文章、卡片、貼文。"],["`aside`","補充內容。","側欄、相關連結。"],["`footer`","頁面或章節結尾。","版權、次要連結。"],["`div`／`span`","通用容器。","沒有更精確元素時。"]],intro:null,note:null,firstColumnHeader:!0,caption:null},{type:"code",title:"部落格骨架",language:"html",code:'<header>\n  <nav aria-label="主要導覽">...</nav>\n</header>\n<main>\n  <section aria-labelledby="latest-title">\n    <h1 id="latest-title">最新文章</h1>\n    <article><h2>文章一</h2><p>摘要……</p></article>\n  </section>\n  <aside><h2>關於作者</h2></aside>\n</main>\n<footer><small>© 2026</small></footer>'},{type:"callout",title:"語意不等於自動好看",paragraphs:["semantic elements 主要描述角色；外觀仍由 CSS 決定。不要因為 div 好排版就放棄正確元素，也不要期待 section 自動變卡片。"],bullets:[],tone:"key"},{type:"exercise",title:"替 div 換角色",task:"把頁首、主要導覽、文章列表、單篇文章、頁尾換成適合的元素。",checklist:[],answerText:"依序可用 header、nav、main/section、article、footer。"}],sources:[{label:"HTML Lists",url:"https://www.w3schools.com/html/html_lists.asp"},{label:"HTML Semantic Elements",url:"https://www.w3schools.com/html/html5_semantic_elements.asp"}]},{id:"html-tables",title:"資料表格：caption、th、scope",shortTitle:"表格",summary:"表格用於真正有欄列關係的資料，不拿來排整個頁面。",duration:"約 20–30 分鐘",objectives:["建立 table、caption、thead、tbody、tr、th、td。","使用 scope=col／row。","分辨資料表格與版面排版。"],sections:[{type:"code",title:"技能表格",language:"html",code:'<table>\n  <caption>目前的網頁技能熟悉度</caption>\n  <thead>\n    <tr>\n      <th scope="col">技能</th>\n      <th scope="col">程度</th>\n      <th scope="col">作品</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <th scope="row">HTML</th>\n      <td>基礎熟練</td>\n      <td>履歷頁</td>\n    </tr>\n  </tbody>\n</table>',preview:'<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><style>body{font-family:system-ui;padding:20px}table{border-collapse:collapse;width:100%}caption{text-align:left;font-weight:bold;margin-bottom:8px}th,td{border:1px solid #aaa;padding:10px;text-align:left}thead{background:#174f56;color:white}</style></head><body><table><caption>目前的網頁技能熟悉度</caption><thead><tr><th scope="col">技能</th><th scope="col">程度</th><th scope="col">作品</th></tr></thead><tbody><tr><th scope="row">HTML</th><td>基礎熟練</td><td>履歷頁</td></tr></tbody></table></body></html>',height:240},{type:"callout",title:"不要用空 td 排版",paragraphs:["兩欄履歷或卡片牆應使用 CSS Grid／Flexbox。table 只處理可由欄標題與列標題解讀的資料。"],bullets:[],tone:"warning"},{type:"exercise",title:"補齊表頭",task:"建立三欄兩列的學習進度表，加入 caption、欄 th scope=col、列 th scope=row。",checklist:["caption 說明整張表。","每欄有表頭。","第一欄列名稱使用 row scope。"]}],sources:[{label:"HTML Tables",url:"https://www.w3schools.com/html/html_tables.asp"},{label:"HTML th",url:"https://www.w3schools.com/tags/tag_th.asp"}]},{id:"html-form-basics",title:"Form、label 與常用 input",shortTitle:"表單基礎",summary:"表單從正確 label、type、name 開始；先利用原生 required 與 input type，再由 JavaScript增強。",duration:"約 20–30 分鐘",objectives:["建立 form、label、input、button。","使用 text、email、number、date、checkbox、radio。","理解 id／for、name、required、placeholder。"],sections:[{type:"table",title:"欄位屬性",headers:["屬性","用途","重點"],rows:[["`id`","label 與 JS 定位。","頁內唯一。"],["`for`","label 指向欄位 id。","值必須完全相同。"],["`name`","提交資料的 key。","id 不能取代。"],["`type`","輸入語意與瀏覽器行為。","email、number、date 等。"],["`required`","原生必填檢查。","不能取代真正後端驗證。"],["`placeholder`","格式提示。","不能取代 label。"]],intro:null,note:null,firstColumnHeader:!0,caption:null},{type:"code",title:"基本聯絡表單",language:"html",code:'<form>\n  <div>\n    <label for="name">姓名</label>\n    <input id="name" name="name" autocomplete="name" required>\n  </div>\n  <div>\n    <label for="email">Email</label>\n    <input id="email" name="email" type="email" autocomplete="email" required>\n  </div>\n  <label><input type="checkbox" name="subscribe"> 訂閱更新</label>\n  <button type="submit">送出</button>\n  <button type="button">顯示預覽</button>\n</form>'},{type:"callout",title:"form 內 button 的預設",paragraphs:['沒有 type 的 button 可能預設為 submit。不是提交用途，一律明確寫 `type="button"`。'],bullets:[],tone:"warning"},{type:"exercise",title:"修正可用性",task:"替兩個沒有 label 的 input 補 id、label for、name；把預覽按鈕改成 type=button。",checklist:["點 label 會聚焦欄位。","name 有意義。","預覽不會提交。"]}],sources:[{label:"HTML Forms",url:"https://www.w3schools.com/html/html_forms.asp"},{label:"HTML Input Types",url:"https://www.w3schools.com/html/html_form_input_types.asp"},{label:"HTML Input Attributes",url:"https://www.w3schools.com/html/html_form_attributes.asp"}]},{id:"html-form-controls",title:"select、datalist、textarea 與欄位群組",shortTitle:"表單控制項",summary:"固定選項使用 select；可自由輸入但提供建議使用 datalist；多行文字使用 textarea；相關 radio／checkbox 使用 fieldset 與 legend。",duration:"約 20–30 分鐘",objectives:["使用 select/option。","使用 input list + datalist。","使用 textarea、fieldset、legend。"],sections:[{type:"table",title:"控制項怎麼選",headers:["需求","元素","注意"],rows:[["只能選固定值","`select` + `option`","第一個空 value 可作提示。"],["可自由輸入，提供建議","`input list` + `datalist`","datalist 不限制輸入。"],["多行內容","`textarea`","文字放在開始與結束標籤間，但常保持空白。"],["一組相關選項","`fieldset` + `legend`","radio 同 name 才是同一組。"]],intro:null,note:null,firstColumnHeader:!0,caption:null},{type:"code",title:"完整控制項",language:"html",code:'<label for="topic">聯絡主題</label>\n<select id="topic" name="topic" required>\n  <option value="">請選擇</option>\n  <option value="job">工作邀約</option>\n  <option value="project">專案合作</option>\n</select>\n\n<label for="skill">主要技能</label>\n<input id="skill" name="skill" list="skill-options">\n<datalist id="skill-options">\n  <option value="HTML">\n  <option value="CSS">\n  <option value="JavaScript">\n</datalist>\n\n<label for="message">留言</label>\n<textarea id="message" name="message" rows="5"></textarea>\n\n<fieldset>\n  <legend>偏好的回覆方式</legend>\n  <label><input type="radio" name="reply" value="email" checked> Email</label>\n  <label><input type="radio" name="reply" value="phone"> 電話</label>\n</fieldset>'},{type:"exercise",title:"select 還是 datalist？",task:"縣市必須從清單選；技能可選建議也可自填。分別選控制項。",checklist:[],answerText:"縣市使用 select；技能使用 input list 搭配 datalist。"}],sources:[{label:"HTML Form Elements",url:"https://www.w3schools.com/html/html_form_elements.asp"},{label:"HTML Select",url:"https://www.w3schools.com/tags/tag_select.asp"},{label:"HTML datalist",url:"https://www.w3schools.com/tags/tag_datalist.asp"}]},{id:"html-accessibility",title:"無障礙基礎：鍵盤、名稱與 ARIA",shortTitle:"無障礙基礎",summary:"先用原生語意建立鍵盤可操作的介面，再以 label、alt 與必要的 ARIA 補足名稱和動態狀態。",duration:"約 15–20 分鐘",objectives:["優先選擇具原生語意與鍵盤行為的 HTML 元素。","保留鍵盤焦點，並提供可辨識的 accessible name。","只在原生 HTML 不足時使用 ARIA，並同步更新動態狀態。"],sections:[{type:"text",title:"先把原生 HTML 用對",paragraphs:["無障礙不是最後才加上的模式。從正確的 heading、nav、button、a、label、alt 與表格表頭開始，瀏覽器就能提供許多鍵盤與輔助技術需要的語意。","能用 button 就不要先做可點擊 div；能用 label 命名欄位就不要只靠 placeholder。原生元素通常已具備焦點、Enter／Space 操作與適合的角色。"],bullets:["所有互動都要能只用鍵盤完成，焦點位置必須清楚可見。","內容順序與標題層級要合理；不要只靠顏色、位置或圖示傳達意思。","頁面開頭可提供跳到主要內容的 skip link，讓鍵盤使用者略過重複導覽。"],ordered:!1},{type:"table",title:"常見需求與做法",headers:["需求","優先做法","避免"],rows:[["執行動作","使用 button；連到別處才使用 a。","只有 click 的 div 或 span。"],["欄位名稱","label 的 for 對應控制項 id。","只用會消失的 placeholder。"],["只有圖示的按鈕","提供 aria-label 等可辨識名稱。","只顯示圖示而沒有名稱。"],["展開／收合","原生 button 搭配 aria-expanded 與 aria-controls。","狀態改變後仍保留錯誤 aria-expanded。"],["鍵盤位置","保留 outline 或提供清楚的 :focus-visible。","只寫 outline:none。"]],intro:null,note:null,firstColumnHeader:!0,caption:null},{type:"code",title:"可操作的選單按鈕",language:"html",code:'<a class="skip-link" href="#main">跳到主要內容</a>\n\n<button type="button"\n        aria-expanded="false"\n        aria-controls="site-menu">\n  開啟選單\n</button>\n\n<nav id="site-menu" aria-label="主要導覽" hidden>\n  <a href="#about">關於我</a>\n  <a href="#contact">聯絡</a>\n</nav>\n\n<main id="main">...</main>'},{type:"callout",title:"ARIA 不會自動增加行為",paragraphs:["aria-label 會提供名稱，aria-expanded 會描述狀態，但它們不會自動開啟選單、處理鍵盤或改變畫面。JavaScript 改變介面時，也要同步更新 hidden 與 aria-expanded。"],bullets:["優先使用原生元素；不要用 ARIA 重做已存在的 HTML 語意。","可見文字已能清楚命名時，不要隨意用 aria-label 覆蓋成不同名稱。"],tone:"warning"},{type:"exercise",title:"只用鍵盤檢查",task:"不使用滑鼠，以 Tab、Shift+Tab、Enter 與 Space 走過導覽、按鈕和表單，找出無法聚焦、沒有名稱或看不到焦點的位置。",checklist:["互動元素都可到達且順序合理。","焦點樣式清楚可見。","圖示按鈕與表單欄位都有可辨識名稱。","展開狀態與畫面同步。"]}],sources:[{label:"HTML Accessibility",url:"https://www.w3schools.com/html/html_accessibility.asp"},{label:"Accessibility Introduction",url:"https://www.w3schools.com/accessibility/index.php"}]},{id:"html-seo",title:"基礎 SEO：可理解、可索引的頁面",shortTitle:"基礎 SEO",summary:"讓人與搜尋引擎都能理解頁面主題：提供清楚的 title、description、標題結構、連結文字與可索引正文。",duration:"約 15–20 分鐘",objectives:["為每頁撰寫獨特且符合內容的 title 與 meta description。","用標題、語意元素、描述性連結與 alt 說清楚內容關係。","知道基礎 SEO 改善可理解性與搜尋呈現，但不保證排名。"],sections:[{type:"text",title:"搜尋引擎先要讀得到內容",paragraphs:["現代搜尋引擎會綜合許多訊號理解頁面。對入門靜態網站而言，最實用的起點是讓重要內容成為可讀取的 HTML 文字，並以清楚的文件結構說明主題，而不是把正文全做成圖片或只靠視覺位置。","無障礙與 SEO 都受益於清楚語意、標題、連結與圖片替代文字，但目的不完全相同：無障礙優先確保每個人能使用內容；SEO 關注搜尋系統如何發現、理解與呈現頁面。"],bullets:["每頁 title 應獨特、具體，並與實際頁面內容一致。","meta description 是搜尋摘要的候選文字，不是保證採用，也不是保證排名的按鈕。","用自然、具體的正文回答使用者需求；不要重複堆疊關鍵字。"],ordered:!1},{type:"table",title:"頁面 SEO 基礎檢核",headers:["項目","建議","常見問題"],rows:[["title","簡潔描述本頁主題，且每頁不同。","所有頁面都叫「首頁」或堆滿關鍵字。"],["meta description","用一兩句自然摘要說明內容價值。","與正文無關、每頁完全相同。"],["h1／h2／h3","依內容層級建立可理解大綱。","為了字體大小跳級或把每段都設成 h1。"],["連結文字","直接說明目的，例如「查看 HTML 入門課程」。","所有連結都寫「點這裡」。"],["圖片 alt","替代圖片在目前內容中的必要資訊。","塞入無關關鍵字或只寫檔名。"]],intro:null,note:null,firstColumnHeader:!0,caption:null},{type:"code",title:"一頁清楚的搜尋摘要資訊",language:"html",code:'<!doctype html>\n<html lang="zh-Hant">\n<head>\n  <meta charset="utf-8">\n  <meta name="viewport" content="width=device-width, initial-scale=1">\n  <title>王小明｜前端學習履歷與作品</title>\n  <meta name="description" content="王小明的前端學習履歷，整理 HTML、CSS、JavaScript 作品與聯絡方式。">\n</head>\n<body>\n  <main>\n    <h1>王小明｜前端學習履歷</h1>\n    <p>查看我的學習經歷、作品與實作筆記。</p>\n    <a href="posts/html-notes.html">閱讀 HTML 入門筆記</a>\n  </main>\n</body>\n</html>'},{type:"callout",title:"沒有保證排名的單一標籤",paragraphs:["title、description 與語意 HTML 很重要，但搜尋結果還會受內容品質、是否符合查詢意圖、網站可存取性與其他訊號影響。不要承諾加上一個 meta 標籤就能排到第一名。"],bullets:["先服務真正的讀者，再讓搜尋引擎容易理解。","內容更新後重新檢查 title、description、標題與內部連結是否仍準確。"],tone:"key"},{type:"exercise",title:"替作品頁做 SEO 快檢",task:"替履歷頁寫一組不重複的 title 與 description，再檢查 h1、章節標題、連結文字、圖片 alt 是否都能說明實際內容。",checklist:["title 與本頁主題一致。","description 是自然摘要，不堆疊關鍵字。","重要內容是可讀取的 HTML 文字。","連結與圖片文字能在脫離視覺位置時被理解。"]}],sources:[{label:"HTML Head",url:"https://www.w3schools.com/html/html_head.asp"},{label:"SEO Introduction",url:"https://www.w3schools.com/seo/seo_intro.php"}]},{id:"html-capstone",title:"HTML 階段實作：履歷／部落格骨架",shortTitle:"HTML 專案",summary:"從 HTML 起始版完成履歷與部落格結構；即使尚未製作 CSS，也要有合理閱讀順序。",duration:"約 45–60 分鐘",objectives:["整合 header/nav/main/section/article/footer。","加入 input、datalist、select、textarea、checkbox 等常用表單控制項。","完成 HTML 自我檢核。"],sections:[{type:"code",title:"綜合骨架",language:"html",code:'<!doctype html>\n<html lang="zh-Hant">\n<head>\n  <meta charset="utf-8">\n  <meta name="viewport" content="width=device-width, initial-scale=1">\n  <title>王小明｜履歷與部落格</title>\n  <link rel="stylesheet" href="styles.css">\n  <script defer src="script.js"><\/script>\n</head>\n<body>\n  <header>\n    <a href="#top">王小明</a>\n    <nav aria-label="主要導覽">\n      <a href="#about">關於我</a>\n      <a href="#posts">文章</a>\n      <a href="#contact">聯絡</a>\n    </nav>\n  </header>\n  <main id="top">\n    <section id="about"><h1>王小明｜前端學習者</h1><p>簡短介紹。</p></section>\n    <section id="posts"><h2>最新文章</h2><article><h3>第一篇筆記</h3><p>摘要。</p></article></section>\n    <section id="contact"><h2>聯絡我</h2>\x3c!-- 表單放這裡 --\x3e</section>\n  </main>\n  <footer><small>© 2026 王小明</small></footer>\n</body>\n</html>'},{type:"callout",title:"HTML 完成檢核",paragraphs:[],bullets:["一頁只有一個主要 h1，層級連續。","主要 main 通常一個。","id 不重複。","圖片有合適 alt。","欄位都有 label；for 與 id 對上；提交欄位有 name。","非提交 button 有 type=button。"],tone:"key"},{type:"links",title:"HTML 階段練習檔",intro:"先檢視或下載 HTML 起始版，只完成 index.html 內標示的 HTML 練習。HTML 階段完成版只是這一階段的答案，還不是網站最終版；它會接著成為 CSS 起始版。",links:[{label:"檢視 HTML 起始版 ↗",url:window.__SINGLE_FILE_ASSET__("~0"),description:"包含 HTML、CSS、JavaScript 三階段提示；從這一版開始即可一路保留自己的檔案。"},{label:"檢視 HTML 階段完成版 ↗",url:window.__SINGLE_FILE_ASSET__("~1"),description:"已完成語意結構、表單、基礎 SEO 與無障礙；CSS、JavaScript 仍保留待完成提示。"},{label:"下載 HTML 起始版 ZIP ↓",url:window.__SINGLE_FILE_ASSET__("~2"),download:"zero-basis-web-practice-html-starter.zip",description:"第一次練習請下載這一份；解壓縮後開啟 index.html。"},{label:"下載 HTML 完成版（CSS 起始版）ZIP ↓",url:window.__SINGLE_FILE_ASSET__("~3"),download:"zero-basis-web-practice-html-completed-css-starter.zip",description:"HTML 未完成或檔案遺失時，可下載這份標準答案接著學 CSS。"}]},{type:"exercise",title:"HTML 階段任務",task:"從 HTML 起始版完成一頁履歷：依檔案內的 HTML TODO 加入導覽、語意內容、文章與聯絡表單；CSS、JavaScript TODO 留到後面的部份。",checklist:["標籤正確關閉。","不用 CSS 仍有合理順序。","header、nav、main、section、article、aside、footer 使用符合內容的語意元素。","input、datalist、select、textarea、checkbox 與 button 都已加入；label 的 for 與欄位 id 對應。","title 與 meta description 自然說明本頁內容；標題層級與連結文字清楚。","可使用鍵盤前往連結、欄位與按鈕，並能用「跳到主要內容」略過導覽。","可直接用瀏覽器開啟。"]}],sources:[{label:"HTML Exercises",url:"https://www.w3schools.com/html/html_exercises.asp"},{label:"HTML Quiz",url:"https://www.w3schools.com/html/html_quiz.asp"}]}]},{id:"css",number:"02",title:"CSS｜樣式與排版",kicker:"Style & Layout",summary:"以 selector 為核心，掌握盒模型、Flexbox、Grid、表格、表單、藍色開關與響應式。",accent:"#176b66",symbol:"{ }",coverLines:[".card {","  display: grid;","  gap: 1rem;","}"],outcomes:["熟練 CSS／JS 共用 selector","排出響應式卡片與雙欄","美化表單與藍色 toggle"],steps:[{id:"css-syntax",title:"CSS 語法與外部樣式表",shortTitle:"CSS 語法",summary:"CSS 規則由 selector 找元素，再用 property 與 value 設定外觀；實務上以外部 styles.css 為主。",duration:"約 20–30 分鐘",objectives:["看懂 selector { property: value; }。","由 link 載入 styles.css。","辨認冒號、分號與大括號錯誤。"],sections:[{type:"code",title:"第一條 CSS",language:"css",code:"h1 {\n  color: #174f56;\n  font-size: 2.5rem;\n}"},{type:"table",title:"規則組成",headers:["部分","例子","說明"],rows:[["Selector","`h1`","選取元素。"],["Property","`color`","要修改的屬性。"],["Value","`#174f56`","設定值。"],["Declaration","`color: #174f56;`","屬性、冒號、值、分號。"]],intro:null,note:null,firstColumnHeader:!0,caption:null},{type:"text",title:"三種加入方式",paragraphs:["自己的專案以 External CSS 為主；internal style 適合單檔示範；inline style 只在無法改樣式表時少量使用。"],bullets:['外部：`<link rel="stylesheet" href="styles.css">`。',"內部：head 中的 `<style>`。","行內：元素的 style 屬性。"],ordered:!1},{type:"lab",title:"修改第一個樣式",instructions:"替 h1 改色，替 p 加 line-height 與 max-width。",starter:'<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><style>\nbody { font-family: system-ui; padding: 24px; }\nh1 { color: #174f56; }\np { /* TODO */ }\n</style></head><body><h1>我的 CSS 頁面</h1><p>讓文字更容易閱讀。</p></body></html>',height:250,solution:'<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><style>\nbody{font-family:system-ui;padding:24px}h1{color:#174f56}p{line-height:1.8;max-width:40rem}\n</style></head><body><h1>我的 CSS 頁面</h1><p>讓文字更容易閱讀。</p></body></html>'},{type:"callout",title:"沒反應先查三件事",paragraphs:[],bullets:["link 路徑。","selector 是否選到。","冒號、分號、大括號是否完整。"],tone:"warning"}],sources:[{label:"CSS Syntax",url:"https://www.w3schools.com/css/css_syntax.asp"},{label:"How To Add CSS",url:"https://www.w3schools.com/css/css_howto.asp"}]},{id:"css-selectors-basic",title:"基本選擇器：element、class、id",shortTitle:"基本選擇器",summary:"Selector 是 CSS 與 JavaScript 共用的定位語言。本章詳細掌握最常用的五種。",duration:"約 20–30 分鐘",objectives:["使用 element、class、id、universal、grouping selector。","知道 class 可重複、id 應唯一。","把同一 selector 放進 querySelector。"],sections:[{type:"table",title:"基本選擇器完整對照",headers:["種類","CSS","選到什麼","HTML","JavaScript"],rows:[["Element（元素）","`p`","所有 p。","`<p>`",'`querySelector("p")`'],["Class（類別）","`.card`","所有 class 含 card。",'`class="card"`','`querySelectorAll(".card")`'],["ID（識別）","`#contact`","唯一 id=contact。",'`id="contact"`','`querySelector("#contact")`'],["Universal（全部）","`*`","範圍內所有元素。","全部",'`querySelectorAll("*")`'],["Grouping（群組）","`h1, h2`","h1 與 h2。","標題",'`querySelectorAll("h1, h2")`']],intro:null,note:null,firstColumnHeader:!0,caption:null},{type:"code",title:"class 是元件樣式主力",language:"css",code:"p { line-height: 1.75; }\n\n.card {\n  padding: 1rem;\n  border: 1px solid #d7dedb;\n}\n\n.featured { border-color: #e0643d; }\n#contact { scroll-margin-top: 5rem; }\nh1, h2, h3 { line-height: 1.2; }"},{type:"code",title:"對應 HTML",language:"html",code:'<article class="card featured">\n  <h2>精選文章</h2>\n  <p>同時符合 .card 與 .featured。</p>\n</article>\n<section id="contact"><h2>聯絡我</h2></section>'},{type:"callout",title:"命名看角色，不看顏色",paragraphs:["優先 `.primary-button`、`.profile-card`、`.error-message`，不要用 `.red-text`、`.left-box` 綁死外觀。"],bullets:[],tone:"tip"},{type:"exercise",title:"寫五種 selector",task:"選所有段落、所有 card、唯一 contact、全部元素、h1 與 h2。",checklist:[],answerCode:"p { }\n.card { }\n#contact { }\n* { }\nh1, h2 { }",language:"css"}],sources:[{label:"CSS Selectors",url:"https://www.w3schools.com/css/css_selectors.asp"},{label:"CSS Grouping",url:"https://www.w3schools.com/css/css_grouping_selectors.asp"}]},{id:"css-selectors-advanced",title:"關係、屬性、狀態與偽元素",shortTitle:"常用組合",summary:"只學實務常用的 descendant、child、adjacent sibling、attribute、pseudo-class 與 ::before。",duration:"約 20–30 分鐘",objectives:["分辨空白、>、+。","使用 attribute selector。","使用 :hover、:focus、:checked 與 ::before。"],sections:[{type:"table",title:"常用 selector 表",headers:["名稱","寫法","選取範圍","用途"],rows:[["Descendant（後代）","`.card p`","card 內任何深度 p。","元件內文字。"],["Child（直接子）","`.nav > a`","nav 第一層 a。","不影響子選單。"],["Adjacent sibling（相鄰兄弟）","`input + .hint`","緊接 input 的 hint。","欄位提示、toggle。"],["Attribute（屬性）",'`input[type="email"]`',"email input。","特定欄位。"],["Pseudo-class（狀態）","`a:hover`、`input:focus`、`input:checked`","互動狀態。","回饋與開關。"],["Pseudo-element","`.tag::before`","內容前的裝飾片段。","裝飾，不放關鍵文字。"]],intro:null,note:null,firstColumnHeader:!0,caption:null},{type:"code",title:"差一個空白，意思不同",language:"css",code:'.card.title { /* 同一元素同時有 card 與 title */ }\n.card .title { /* card 裡面的 title */ }\n\n.nav a { color: #174f56; }\n.nav > a { font-weight: 700; }\n\ninput[type="email"] { border: 2px solid #8aa9a5; }\ninput:focus + .hint { color: #174f56; }\n.tag::before { content: "•"; margin-right: .4rem; }'},{type:"callout",title:"+ 要求緊鄰",paragraphs:["`input:checked + .slider` 要求 slider 緊接在 input 後面；若中間多包一層 div，就選不到。"],bullets:[],tone:"warning"},{type:"exercise",title:"選到正確範圍",task:"寫出 nav 的直接子 a、所有 required 欄位、hover button、已勾選 checkbox 後的 slider。",checklist:[],answerCode:'.nav > a { }\n[required] { }\nbutton:hover { }\ninput[type="checkbox"]:checked + .slider { }',language:"css"}],sources:[{label:"CSS Combinators",url:"https://www.w3schools.com/css/css_combinators.asp"},{label:"Attribute Selectors",url:"https://www.w3schools.com/css/css_attribute_selectors.asp"},{label:"Pseudo-classes",url:"https://www.w3schools.com/css/css_pseudo_classes.asp"}]},{id:"css-cascade",title:"Cascade、specificity 與 inheritance",shortTitle:"層疊順序",summary:"多條規則同時命中時，瀏覽器依重要性、specificity 與先後順序決定結果。",duration:"約 20–30 分鐘",objectives:["判斷哪條規則生效。","理解 ID、class、element 的優先層級。","知道常見繼承屬性與 !important 風險。"],sections:[{type:"text",title:"四步判斷",paragraphs:[],bullets:["是否選到同一元素與同一 property？","是否有 inline 或 important？","比較 specificity：ID > class/attribute/pseudo-class > element。","相同時較後規則生效。"],ordered:!1},{type:"table",title:"簡化 specificity",headers:["Selector","ID","Class","Element","相對強度"],rows:[["`p`","0","0","1","弱"],["`.intro`","0","1","0","強於 p"],["`p.intro`","0","1","1","強於 .intro"],["`#hero`","1","0","0","強於多數 class 組合"]],intro:null,note:null,firstColumnHeader:!1,caption:null},{type:"code",title:"哪個 color？",language:"css",code:"p { color: gray; }\n.intro { color: blue; }\nmain .intro { color: green; }\n.intro { color: purple; }"},{type:"text",title:"答案",paragraphs:["位於 main 內且 class=intro 的 p 會是 green，因為 `main .intro` 比單一 `.intro` specificity 高；後寫的 purple 仍較弱。"],bullets:[],ordered:!1},{type:"callout",title:"不要先加 !important",paragraphs:["先查 selector 是否過廣、specificity 是否不一致、CSS 是否載入。important 會讓後續維護困難。"],bullets:[],tone:"warning"},{type:"exercise",title:"優先順序",task:'`<p id="summary" class="note">` 同時有 p、.note、#summary color，哪個優先？',checklist:[],answerText:"#summary。若只有兩條相同 .note，後寫者生效。"}],sources:[{label:"CSS Specificity",url:"https://www.w3schools.com/css/css_specificity.asp"},{label:"CSS Inheritance",url:"https://www.w3schools.com/css/css_inheritance.asp"}]},{id:"css-visual",title:"顏色、字體、文字與常用單位",shortTitle:"視覺基礎",summary:"掌握 hex／rgb、font fallback、line-height，以及 px／rem／% 的常見用途。",durat g 還是 margin？",task:"卡片文字離邊框太近；兩張卡片彼此太近。分別使用哪個？",checklist:[],answerText:"文字到邊框用 padding；卡片與卡片間用 margin 或容器 gap。"}],sources:[{label:"CSS Box Model",url:"https://www.w3schools.com/css/css_boxmodel.asp"},{label:"CSS Box Sizing",url:"https://www.w3schools.com/css/css3_box-sizing.asp"}]},{id:"css-display-overflow",title:"尺寸、display 與 overflow",shortTitle:"顯示與溢出",summary:"先掌握 width/max-width、block/inline/inline-block/none，以及內容過寬時的 overflow。",duration:"約 20–30 分鐘",objectives:["使用 max-width 與百分比。","分辨 block、inline、inline-block、none。","處理圖片與表格溢出。"],sections:[{type:"table",title:"display 常用值",headers:["值","行為","例子"],rows:[["`block`","通常獨占一行，可設尺寸。","div、section 預設。"],["`inline`","跟文字同行，width/height 不直覺。","span、a 預設。"],["`inline-block`","同行但可設尺寸與 padding。","小標籤。"],["`none`","不顯示也不佔版面。","切換區塊；注意可存取狀態。"]],intro:null,note:null,firstColumnHeader:!0,caption:null},{type:"code",title:"穩定容器與圖片",language:"css",code:".container {\n  width: min(100% - 2rem, 70rem);\n  margin-inline: auto;\n}\nimg { display: block; max-width: 100%; height: auto; }\n.table-wrap { overflow-x: auto; }"},{type:"callout",title:"hidden 與透明不同",paragraphs:["`display:none` 不佔位；`visibility:hidden` 與 `opacity:0` 通常仍佔位。透明元素也可能仍可互動，需小心。"],bullets:[],tone:"warning"},{type:"exercise",title:"避免固定寬度",task:"把 width:1200px 的主容器改成最大 70rem、窄畫面保留 1rem 左右邊距。",checklist:[],answerCode:".container { width: min(100% - 2rem, 70rem); margin-inline: auto; }",language:"css"}],sources:[{label:"CSS Display",url:"https://www.w3schools.com/css/css_display_visibility.asp"},{label:"CSS Max-width",url:"https://www.w3schools.com/css/css_max-width.asp"},{label:"CSS Overflow",url:"https://www.w3schools.com/css/css_overflow.asp"}]},{id:"css-flexbox",title:"Flexbox：單一方向排版",shortTitle:"Flexbox",summary:"Flexbox 適合導覽列、按鈕列、卡片列與垂直置中。先熟練主軸、交叉軸、gap、wrap。",duration:"約 20–30 分鐘",objectives:["建立 flex container。","使用 justify-content、align-items、gap、wrap。","理解主軸會隨 flex-direction 變化。"],sections:[{type:"table",title:"Flex 常用屬性",headers:["屬性","作用","常用值"],rows:[[ ,sections:[{type:"table",title:"怎麼選",headers:["需求","工具","理由"],rows:[["導覽、按鈕列","Flexbox","單一方向。"],["文章卡片牆","Grid","欄列一起控制。"],["履歷雙欄","Grid","主內容與側欄比例。"],["單一元素置中","兩者都可","選較簡單者。"]],intro:null,note:null,firstColumnHeader:!0,caption:null},{type:"code",title:"自動換欄卡片",language:"css",code:".post-grid {\n  display: grid;\n  grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr));\n  gap: 1.25rem;\n}\n.post-card { padding: 1.25rem; border: 1px solid #d7dedb; }",preview:'<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><style>*{box-sizing:border-box}body{font-family:system-ui;padding:20px;background:#f7f7f2}.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(12rem,1fr));gap:1rem}.c{padding:1rem;border:1px solid #ccd8d5;background:white;border-radius:.7rem}</style></head><body><section class="g"><article class="c"><h2>HTML</h2><p>結構</p></article><article class="c"><h2>CSS</h2><p>排版</p></article><article class="c"><h2>JS</h2><p>互動</p></article></section></body></html>',height:230},{type:"callout",title:"minmax 直覺",paragraphs:["每欄最窄 16rem，有空間就平均分配；auto-fit 依容器寬度決定欄數。"],bullets:[],tone:"tip"},{type:"exercise",title:"技能卡片 Grid",task:"建立 skill-grid，卡片最窄 14rem，空間不足自動換欄。",checklist:[],answerCode:".skill-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(14rem,1fr)); gap:1rem; }",language:"css"}],sources:[{label:"CSS Grid",url:"https://www.w3schools.com/css/css_grid.asp"},{label:"Grid Container",url:"https://www.w3schools.com/css/css_grid_container.asp"}]},{id:"css-position",title:"Position：局部疊放",shortTitle:"Position",summary:"主要排版交給 Flex／Grid；position 用於徽章、固定按鈕、sticky 導覽等局部需求。",duration:"約 20–30 分鐘",objectives:["分辨 static、relative、absolute、fixed、sticky。","用 relative 建立 absolute 參考。","避免 absolute 排整頁。"],sections:[{type:"table",title:"Position 對照",headers:["值","離開正常流","用途"],rows:[["static","否","預設。"],["relative","否","absolute 的定位參考。"],["absolute","是","卡片角落徽章。"],["fixed","是","固定視窗按鈕。"],["sticky","部分","捲動後黏住。"]],intro:null,note:null,firstColumnHeader:!0,caption:null},{type:"code",title:"卡片徽章",language:"css",code:".card { position: relative; padding: 2rem 1.25rem 1.25rem; }\n.badge { position: absolute; top: .75rem; right: .75rem; }"},{type:"callout",title:"不要用座標排整頁",paragraphs:["若每個區塊都寫 absolute、top、left，文字一多就會重疊；改用 Flexbox 或 Grid。"],bullets:[],tone:"warning"},{type:"exercise",title:"定位推理",task:"badge 要以 card 為基準，誰設 relative？漏掉會找誰？",checklist:[],answerText:"card 設 relative；absolute 會找最近的非 static 祖先，找不到則相對更外層初始包含區塊。"}],sources:[{label:"CSS Position",url:"https://www.w3schools.com/css/css_positioning.asp"},{label:"CSS Z-index",url:"https://www.w3schools.com/css/css_z-index.asp"}]},{id:"css-interactions",title:"連結、按鈕與焦點狀態",shortTitle:"互動狀態",summary:"讓連結與按鈕可辨識，並同時處理 hover、focus-visible、disabled。",duration:"約 20–30 分鐘",objectives:["分辨 link 與 button。","建立正常、hover、focus-visible、disabled。","保留鍵盤焦點。"],sections:[{type:"table",title:"連結或按鈕",headers:["需求","元素","例子"],rows:[["前往資源","`a href`","作品頁、章節。"],["目前頁執行動作","`button type=button`","切換主題。"],["提交表單","`button type=submit`","送出。"]],intro:null,note:null,firstColumnHeader:!0,caption:null},{type:"code",title:"基本狀態",language:"css",code:"a { color:#176b66; text-underline-offset:.2em; }\na:hover { text-decoration-thickness:.15em; }\n\n.button {\n  display:inline-flex; align-items:center; justify-content:center;\n  padding:.65rem 1rem; border:2px solid #176b66;\n  border-radius:.5rem; background:#176b66; color:white;\n  cursor:pointer;\n}\n.button:hover { filter:brightness(.9); }\n.button:focus-visible, a:focus-visible { outline:3px solid #f5b942; outline-offset:3px; }\n.button:disabled { opacity:.55; cursor:not-allowed; }"},{type:"callout",title:"不要只寫 outline:none",paragraphs:["拿掉原生焦點框時必須提供清楚替代樣式，否則鍵盤使用者不知道焦點在哪裡。"],bullets:[],tone:"warning"},{type:"exercise",title:"完善按鈕",task:"建立四種狀態並用 Tab 測試。",checklist:["焦點可見。","disabled 清楚。","文字描述動作。"]}],sources:[{label:"CSS Links",url:"https://www.w3schools.com/css/css_link.asp"},{label:"CSS Buttons",url:"https://www.w3schools.com/css/css3_buttons.asp"}]},{id:"css-tables-forms",title:"表格與表單樣式",shortTitle:"表格與表單",summary:"保留 HTML 原生語意，用一致間距、邊框、焦點與 overflow 做出可讀的資料畫面。",duration:"約 20–30 分鐘",objectives:["美化 table、th、td。","統一 input、select、textarea。","避免固定寬度溢出。"],sections:[{type:"code",title:"表格",language:"css",code:".table-wrap { overflow-x:auto; }\ntable { width:100%; border-collapse:collapse; }\ncaption { margin-bottom:.75rem; font-weight:700; text-align:left; }\nth, td { padding:.75rem; border-bottom:1px solid #d7dedb; text-align:left; white-space:nowrap; }\nthead { background:#e9f2f0; }"},{type:"code",title:"表單",language:"css",code:".field { display:grid; gap:.4rem; }\ninput, select, textarea, button { font:inherit; }\ninput, select, textarea {\n  width:100%; padding:.7rem .8rem;\n  border:1px solid #8aa19e; border-radius:.45rem;\n}\ntextarea { resize:vertical; }\ninput:focus, select:focus, textarea:focus {\n  border-color:#176b66; outline:3px solid rgb(23 107 102 / .2);\n}"},{type:"callout",title:"CSS 不能補 label",paragraphs:["placeholder 不是 label。先把 HTML 的 label、name、input type 做對，再處理外觀。"],bullets:[],tone:"key"},{type:"lab",title:"表單外觀",instructions:"替欄位與按鈕補一致樣式。",starter:'<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><style>*{box-sizing:border-box}body{font-family:system-ui;padding:24px}form{max-width:30rem;display:grid;gap:1rem}.field{display:grid;gap:.4rem}/* TODO */</style></head><body><form><div class="field"><label for="n">姓名</label><input id="n"></div><div class="field"><label for="t">主題</label><select id="t"><option>合作</option></select></div><div class="field"><label for="m">留言</label><textarea id="m"></textarea></div><button>送出</button></form></body></html>',height:400,solution:'<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><style>*{box-sizing:border-box}body{font-family:system-ui;padding:24px}form{max-width:30rem;display:grid;gap:1rem}.field{display:grid;gap:.4rem}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;padding:.75rem;border:1px solid #8aa19e;border-radius:.45rem}textarea{resize:vertical}button{padding:.75rem;border:0;background:#176b66;color:white}</style></head><body><form><div class="field"><label for="n">姓名</label><input id="n"></div><div class="field"><label for="t">主題</label><select id="t"><option>合作</option></select></div><div class="field"><label for="m">留言</label><textarea id="m"></textarea></div><button>送出</button></form></body></html>'}],sources:[{label:"CSS Tables",url:"https://www.w3schools.com/css/css_table.asp"},{label:"CSS Forms",url:"https://www.w3schools.com/css/css_form.asp"}]},{id:"css-toggle",title:"Checkbox 變藍色 Toggle switch",shortTitle:"藍色開關",summary:"保留原生 checkbox 可操作性，再用 label、slider、:checked 與相鄰兄弟 selector 做開關。",duration:"約 20–30 分鐘",objectives:["用 accent-color 改原生勾選色。","建立鍵盤可用的 toggle。","解釋 input:checked + .slider。"],sections:[{type:"code",title:"最簡單方案",language:"css",code:'input[type="checkbox"], input[type="radio"] { accent-color:#176bff; }'},{type:"code",title:"Toggle HTML",language:"html",code:'<label class="switch">\n  <input id="theme-toggle" type="checkbox">\n  <span class="slider" aria-hidden="true"></span>\n  <span>深色模式</span>\n</label>'},{type:"code",title:"Toggle CSS",language:"css",code:'.switch { display:inline-flex; align-items:center; gap:.75rem; cursor:pointer; }\n.switch input { position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); }\n.slider { position:relative; width:3rem; height:1.65rem; border-radius:999px; background:#879291; }\n.slider::before { content:""; position:absolute; top:.2rem; left:.2rem; width:1.25rem; height:1.25rem; border-radius:50%; background:white; transition:.2s; }\n.switch input:checked + .slider { background:#176bff; }\n.switch input:checked + .slider::before { transform:translateX(1.35rem); }\n.switch input:focus-visible + .slider { outline:3px solid rgb(23 107 255 / .3); outline-offset:3px; }',preview:'<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><style>body{font-family:system-ui;padding:30px}.switch{display:inline-flex;align-items:center;gap:.75rem;cursor:pointer}.switch input{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}.slider{position:relative;width:3rem;height:1.65rem;border-radius:999px;background:#879291}.slider:before{content:"";position:absolute;top:.2rem;left:.2rem;width:1.25rem;height:1.25rem;border-radius:50%;background:white;transition:.2s}.switch input:checked+.slider{background:#176bff}.switch input:checked+.slider:before{transform:translateX(1.35rem)}</style></head><body><label class="switch"><input type="checkbox"><span class="slider"></span><span>深色模式</span></label></body></html>',height:170},{type:"callout",title:"不要 display:none",paragraphs:["display:none 通常讓 input 無法取得鍵盤焦點。visually hidden 保留操作，再替 focus-visible + slider 加焦點框。"],bullets:[],tone:"warning"},{type:"exercise",title:"測試開關",task:"用 Tab 聚焦、Space 切換；再把 slider 移到 input 前面，觀察 + selector 失效。",checklist:["鍵盤可操作。","焦點可見。","開關狀態清楚。"]}],sources:[{label:"Toggle Switch",url:"https://www.w3schools.com/howto/howto_css_switch.asp"},{label:"Attribute Selectors",url:"https://www.w3schools.com/css/css_attribute_selectors.asp"}]},{id:"css-responsive",title:"Responsive design 與綜合實作",shortTitle:"響應式專案",summary:"先讓小畫面單欄可讀，再用 min-width media query 增加欄數；以內容決定 breakpoint。",duration:"約 45–60 分鐘",objectives:["確認 viewport meta。","使用 max-width、彈性圖片與自動換欄。","寫 min-width media query 並完成專案。"],sections:[{type:"code",title:"手機優先",language:"css",code:".container { width:min(100% - 2rem,70rem); margin-inline:auto; }\nimg { max-width:100%; height:auto; }\n.resume-layout { display:grid; gap:1.5rem; }\n\n@media (min-width:48rem) {\n  .resume-layout { grid-template-columns:2fr 1fr; }\n}"},{type:"table",title:"響應式檢查",headers:["問題","處理"],rows:[["內容超出畫面","查固定 width、表格、圖片、長字串。"],["文字太小","正文約 1rem，不靠縮小塞內容。"],["表格太寬","外層 overflow-x:auto。"],["導覽擁擠","flex-wrap 或小畫面改垂直。"],["卡片欄數","Grid auto-fit/minmax 或 media query。"]],intro:null,note:null,firstColumnHeader:!0, duration:"約 20–30 分鐘",objectives:["說出 JavaScript 在頁面中的責任。","使用外部 script 與 defer。","開啟 DevTools Console 並讀懂第一個錯誤。"],sections:[{type:"code",title:"連接 script.js",language:"html",code:'<script defer src="script.js"><\/script>'},{type:"code",title:"第一段 JavaScript",language:"javascript",code:'console.log("JavaScript 已載入");\n\nconst title = document.querySelector("h1");\nconsole.log(title);'},{type:"table",title:"常用觀察工具",headers:["寫法","用途","初學提醒"],rows:[["`console.log(value)`","印出值或元素。","確認程式走到哪裡。"],["`console.error(message)`","標示錯誤訊息。","適合自己檢查失敗條件。"],["Console 錯誤第一行","指出錯誤類型與位置。","先修第一個錯誤，再重整。"],["Elements 面板","查看瀏覽器實際 DOM。","與原始 HTML 可能不同。"]],intro:null,note:null,firstColumnHeader:!0,caption:null},{type:"callout",title:"為什麼用 defer？",paragraphs:["瀏覽器可先解析 HTML，等 DOM 準備後再依序執行外部 JavaScript。如此 `querySelector()` 不容易因元素尚未出現而得到 null。"],bullets:[],tone:"key"},{type:"exercise",title:"確認載入",task:"在 script.js 印出一句文字與 h1 元素；若 Console 看不到，依序檢查檔名、路徑、拼字與第一個錯誤。",checklist:["script 使用 defer。","Console 有自訂訊息。","Console 沒有未處理紅色錯誤。"]}],sources:[{label:"JavaScript Introduction",url:"https://www.w3schools.com/js/js_intro.asp"},{label:"JavaScript Where To",url:"https://www.w3schools.com/js/js_whereto.asp"},{label:"JavaScript Debugging",url:"https://www.w3schools.com/js/js_debugging.asp"}]},{id:"js-variables-types",title:"變數、值與基本資料型別",shortTitle:"變數與型別",summary:"用 const 保存不重新指定的值，用 let 保存之後要重新指定的值；先掌握字串、數字、布林、null、undefined、Array 與 Object。",duration:"約 20–30 分鐘",objectives:["正確選擇 const 或 let。","辨認常見 data types（資料型別）。","使用 typeof 與 Array.isArray() 做基本檢查。"],sections:[{type:"code",title:"宣告與重新指定",language:"javascript",code:'const siteName = "小明的部落格";\nlet postCount = 3;\npostCount = postCount + 1;\n\nconst isPublished = true;\nconst selectedPost = null;\nlet draftTitle; // undefined'},{type:"table",title:"本課要會的型別",headers:["型別","例子","用途"],rows:[["String（字串）",'`"王小明"`',"文字。"],["Number（數字）","`18`、`3.5`","計算。"],["Boolean（布林）","`true`／`false`","開關與條件。"],["null","`selectedPost = null`","刻意表示目前沒有值。"],["undefined","宣告但尚未給值","通常代表尚未設定。"],["Array（陣列）",'`["HTML", "CSS"]`',"有順序的一組值。"],["Object（物件）",'`{ name: "小明" }`',"一筆有名稱欄位的資料。"]],intro:null,note:null,firstColumnHeader:!0,caption:null},{type:"code",title:"檢查型別",language:"javascript",code:'console.log(typeof "你好");     // "string"\nconsole.log(typeof 42);         // "number"\nconsole.log(typeof true);       // "boolean"\nconsole.log(typeof undefined);  // "undefined"\nconsole.log(typeof null);       // "object"（歷史特例）\nconsole.log(Array.isArray([])); // true'},{type:"callout",title:"const 不是完全不能改",paragraphs:["const 禁止把變數重新指向另一個值；但 const 陣列仍可 push，const 物件的屬性仍可修改。本課先以『預設 const，需要重新指定才用 let』為原則。"],bullets:[],tone:"warning"},{type:"exercise",title:"選 const 或 let",task:"網站名稱不變、目前頁碼會變、技能清單會 push 新項目。分別選 const／let。",checklist:[],answerText:"網站名稱使用 const；目前頁碼使用 let；技能陣列本身不重新指定時可使用 const，即使之後會 push。"}],sources:[{label:"JavaScript Variables",url:"https://www.w3schools.com/js/js_variables.asp"},{label:"JavaScript Data Types",url:"https://www.w3schools.com/js/js_datatypes.asp"},{label:"JavaScript typeof",url:"https://www.w3schools.com/js/js_typeof.asp"}]},{id:"js-operators",title:"運算子、比較與字串組合",shortTitle:"運算與比較",summary:"程式會做計算、比較與組合文字；初學最重要的是分清楚指定 `=`、嚴格相等 `===`，以及表單 value 原本是字串。",duration:"約 20–30 分鐘",objectives:["使用基本算術與指定運算子。","用 ===／!== 比較值與型別。","把 input.value 轉成 Number，再進行計算。"],sections:[{type:"table",title:"常用運算子",headers:["類別","運算子","例子"],rows:[["指定","`=`","`count = 2`"],["算術","`+ - * / %`","`total = price * amount`"],["嚴格比較","`=== !==`",'`role === "admin"`'],["大小比較","`> >= < <=`","`score >= 80`"],["邏輯","`&& || !`","`isReady && isValid`"]],intro:null,note:null,firstColumnHeader:!0,caption:null},{type:"code",title:"表單數字要轉型",language:"javascript",code:'const amountInput = document.querySelector("#amount");\nconst price = 120;\nconst amount = Number(amountInput.value);\nconst total = price * amount;'},{type:"code",title:"Template literal（模板字串）",language:"javascript",code:'const name = "小明";\nconst count = 3;\nconst message = `${name} 有 ${count} 篇文章。`;'},{type:"callout",title:"最常見 bug：= 與 ===",paragraphs:["`=` 是把右邊的值指定給左邊；`===` 才是判斷兩邊是否值與型別都相等。條件式中誤寫 `=` 會改變資料，並可能讓判斷意外成立。"],bullets:[],tone:"warning"},{type:"exercise",title:"找出結果",task:'輸入框值為字串 `"2"`。比較 `value + 1` 與 `Number(value) + 1` 的結果。',checklist:[],answerText:'前者是字串串接，得到 "21"；後者先轉數字，得到 3。'}],sources:[{label:"JavaScript Operators",url:"https://www.w3schools.com/js/js_operators.asp"},{label:"JavaScript Comparisons",url:"https://www.w3schools.com/js/js_comparisons.asp"},{label:"JavaScript Template Strings",url:"https://www.w3schools.com/js/js_string_templates.asp"}]},{id:"js-conditionals",title:"條件判斷：if、else if、else",shortTitle:"條件判斷",summary:"條件式讓程式依狀態走不同分支；先把條件寫成可讀的 Boolean expression（布林表達式），再處理每種結果。",duration:"約 20–30 分鐘",objectives:["撰寫 if／else if／else。","使用 &&、||、! 組合條件。","辨認常見 truthy／falsy 值。"],sections:[{type:"code",title:"表單訊息",language:"javascript",code:'const name = nameInput.value.trim();\n\nif (name === "") {\n  message.textContent = "請輸入姓名";\n} else if (name.length < 2) {\n  message.textContent = "姓名至少 2 個字";\n} else {\n  message.textContent = `你好，${name}！`;\n}'},{type:"table",title:"初學常遇到的 falsy",headers:["值","條件中視為","提醒"],rows:[["`false`","false","布林假。"],["`0`","false","0 可能是有效數值，判斷時要小心。"],['`""`',"false","空字串。"],["`null`","false","刻意沒有值。"],["`undefined`","false","尚未設定。"],["其他多數值","true","包括空陣列與空物件。"]],intro:null,note:null,firstColumnHeader:!0,caption:null},{type:"callout",title:"先處理失敗情況",paragraphs:["表單驗證常先判斷空值或不合法，再處理成功；每個分支只做一件清楚的事。"],bullets:[],tone:"tip"},{type:"exercise",title:"登入狀態",task:'只有 `isLoggedIn === true` 且 `role === "editor"` 時顯示編輯按鈕，寫出條件。',checklist:[],answerCode:'if (isLoggedIn && role === "editor") {\n  editButton.hidden = false;\n}',language:"javascript"}],sources:[{label:"JavaScript if else",url:"https://www.w3schools.com/js/js_if_else.asp"},{label:"JavaScript Booleans",url:"https://www.w3schools.com/js/js_booleans.asp"}]},{id:"js-arrays-loops",title:"Array（陣列）與迴圈",shortTitle:"陣列與迴圈",summary:"陣列保存有順序的多筆資料，索引從 0 開始；迴圈把同一段操作套用到每一筆資料。",duration:"約 20–30 分鐘",objectives:["讀取與更新陣列項目。","使用 length、push、pop、includes。","用 for...of 與基本 for 走訪陣列。"],sections:[{type:"code",title:"陣列基本操作",language:"javascript",code:'const skills = ["HTML", "CSS"];\nconsole.log(skills[0]);          // HTML\nskills.push("JavaScript");\nconsole.log(skills.length);      // 3\nconsole.log(skills.includes("CSS")); // true'},{type:"table",title:"本課常用方法與屬性",headers:["寫法","作用","是否改動原陣列"],rows:[["`items.length`","項目數量。","否"],["`items.push(value)`","加入最後。","是"],["`items.pop()`","移除並回傳最後一項。","是"],["`items.includes(value)`","是否包含指定值。","否"]],intro:null,note:null,firstColumnHeader:!0,caption:null},{type:"code",title:"兩種基本迴圈",language:"javascript",code:"for (const skill of skills) {\n  console.log(skill);\n}\n\nfor (let index = 0; index < skills.length; index += 1) {\n  console.log(index, skills[index]);\n}"},{type:"callout",title:"Off-by-one（差一格）",paragraphs:["最後一個索引是 `length - 1`。基本 for 迴圈通常寫 `index < items.length`，不是 `<=`；否則最後一次會讀到 undefined。"],bullets:[],tone:"warning"},{type:"exercise",title:"輸出清單",task:"用 for...of 印出每項技能；再用基本 for 同時印出編號 1、2、3。",checklist:[],answerCode:"for (const skill of skills) console.log(skill);\nfor (let i = 0; i < skills.length; i += 1) {\n  console.log(i + 1, skills[i]);\n}",language:"javascript"}],sources:[{label:"JavaScript Arrays",url:"https://www.w3schools.com/js/js_arrays.asp"},{label:"JavaScript Array Methods",url:"https://www.w3schools.com/js/js_array_methods.asp"},{label:"JavaScript For Loop",url:"https://www.w3schools.com/js/js_loop_for.asp"}]},{id:"js-objects",title:"Object（物件）與屬性",shortTitle:"物件",summary:"物件把同一筆資料的具名欄位放在一起；固定欄位用 dot notation，動態欄位名稱用 bracket notation。",duration:"約 20–30 分鐘",objectives:["建立 object literal（物件字面值）。","使用點記法與中括號記法。","更新屬性並把物件資料顯示到頁面。"],sections:[{type:"code",title:"一筆文章資料",language:"javascript",code:'const post = {\n  title: "第一次做網頁",\n  category: "學習筆記",\n  published: true,\n  views: 120\n};\n\nconsole.log(post.title);\npost.views = post.views + 1;'},{type:"table",title:"兩種取值方式",headers:["寫法","適用情況","例子"],rows:[["Dot notation（點記法）","屬性名固定且是合法識別字。","`post.title`"],["Bracket notation（中括號）","屬性名來自變數或包含特殊字元。","`post[fieldName]`"]],intro:null,note:null,firstColumnHeader:!0,caption:null},{type:"code",title:"動態欄位",language:"javascript",code:'const fieldName = "category";\nconsole.log(post[fieldName]); // 學習筆記'},{type:"callout",title:"Object 不等於 JSON",paragraphs:["本課建立的是 JavaScript object。JSON 是交換資料用的文字格式，規則更嚴格；零基礎階段先會操作物件即可。"],bullets:[],tone:"tip"},{type:"exercise",title:"履歷資料",task:"建立 profile 物件，包含 name、role、available 三個屬性；把 role 更新成 Front-end learner。",checklist:[],answerCode:'const profile = { name: "王小明", role: "學生", available: true };\nprofile.role = "Front-end learner";',language:"javascript"}],sources:[{label:"JavaScript Objects",url:"https://www.w3schools.com/js/js_objects.asp"},{label:"JavaScript Object Properties",url:"https://www.w3schools.com/js/js_object_properties.asp"}]},{id:"js-functions-scope",title:"Function（函式）、參數、回傳值與 Scope",shortTitle:"函式與範圍",summary:"函式替一段可重複的工作命名；parameter 接收輸入，return 交回結果。事件監聽器常需要傳入函式本身，而不是立刻呼叫。",duration:"約 20–30 分鐘",objectives:["宣告並呼叫函式。","使用 parameter、argument、return。","分辨 block scope 與函式參考／呼叫。"],sections:[{type:"code",title:"純計算函式",language:"javascript",code:"function calculateTotal(price, amount) {\n  const total = price * amount;\n  return total;\n}\n\nconst result = calculateTotal(120, 3);\nconsole.log(result); // 360"},{type:"table",title:"術語",headers:["英文","中文","例子"],rows:[["Function","函式","`calculateTotal` 整段定義。"],["Parameter","參數","定義中的 `price`。"],["Argument","引數／傳入值","呼叫時的 `120`。"],["Return value","回傳值","交回 `360`。"],["Scope","作用域","變數可被存取的範圍。"]],intro:null,note:null,firstColumnHeader:!0,caption:null},{type:"code",title:"函式本身 vs 立刻呼叫",language:"javascript",code:'button.addEventListener("click", savePost);   // 正確：交出函式\n// button.addEventListener("click", savePost()); // 錯：現在就執行'},{type:"code",title:"Block scope",language:"javascript",code:'if (true) {\n  const message = "只在區塊內";\n  let count = 1;\n}\n// console.log(message); // ReferenceError'},{type:"callout",title:"沒有 return 就是 undefined",paragraphs:["函式可以只做事；但當你期待計算結果時，要明確 return。return 執行後，該次函式也會立刻結束。"],bullets:[],tone:"warning"},{type:"exercise",title:"修正 listener",task:'找出 `addEventListener("click", showMessage())` 的問題。',checklist:[],answerText:"這會在註冊時立即呼叫 showMessage，並把其回傳值當 callback。應傳入 `showMessage`；需要參數時再用包裝函式。"}],sources:[{label:"JavaScript Functions",url:"https://www.w3schools.com/js/js_functions.asp"},{label:"JavaScript Scope",url:"https://www.w3schools.com/js/js_scope.asp"},{label:"JavaScript Events",url:"https://www.w3schools.com/js/js_events.asp"}]},{id:"js-this",title:"this：由呼叫方式決定的目前物件",shortTitle:"this",summary:"`this` 不是固定指向『寫在哪裡』；它主要由函式怎麼被呼叫決定。初學只需要掌握物件方法、一般事件 callback、arrow function 與方法被拆下來四種情況。",duration:"約 30–40 分鐘",objectives:["說明 object method 中的 this。","知道一般 DOM listener 中 this 與 currentTarget 的關係。","知道 arrow function 沒有自己的 this。"],sections:[{type:"table",title:"本課要會的 this 情境",headers:["情境","this 通常是什麼","建議"],rows:[["`profile.intro()` 物件方法","呼叫點左側的 `profile`。","用 `this.name` 讀同一物件。"],["一般函式 DOM listener","被綁定的元素，等同 `event.currentTarget`。","需要目前按鈕時可用 currentTarget，語意更明確。"],["Arrow function listener","沿用外層 this，沒有自己的 this。","直接使用 `event.currentTarget`。"],["`const fn = profile.intro; fn()`","不再是 profile；嚴格模式通常為 undefined。","不要把依賴 this 的方法任意拆下。"]],intro:null,note:null,firstColumnHeader:!0,caption:null},{type:"code",title:"Object method",language:"javascript",code:'const profile = {\n  name: "小明",\n  introduce() {\n    return `我是 ${this.name}`;\n  }\n};\n\nconsole.log(profile.introduce()); // 我是 小明'},{type:"code",title:"Event listener：一般函式",language:"javascript",code:'button.addEventListener("click", function (event) {\n  console.log(this === event.currentTarget); // true\n  this.classList.toggle("is-active");\n});'},{type:"code",title:"Event listener：Arrow function",language:"javascript",code:'button.addEventListener("click", (event) => {\n  // arrow 沒有自己的 this\n  event.currentTarget.classList.toggle("is-active");\n});'},{type:"callout",title:"不要死背 window",paragraphs:["在現代 module、strict mode、不同執行情境中，裸函式的 this 並不一定是 window。考題會要求看『怎麼呼叫』，而不是看函式寫在哪裡。"],bullets:[],tone:"warning"},{type:"exercise",title:"預測 this",task:"`card.open()` 內的 this、一般 click listener 內的 this、arrow listener 內的 this 各是什麼？",checklist:[],answerText:"card.open() 的 this 是 card；一般 listener 的 this 是綁定 listener 的元素；arrow listener 沒有自己的 this，應使用 event.currentTarget 取得綁定元素。"}],sources:[{label:"JavaScript this",url:"https://www.w3schools.com/js/js_this.asp"},{label:"JavaScript Arrow Function",url:"https://www.w3schools.com/js/js_arrow_function.asp"},{label:"JavaScript Events",url:"https://www.w3schools.com/js/js_events.asp"}]},{id:"js-dom-selectors",title:"DOM 與 querySelector 選取元素",shortTitle:"DOM 選取",summary:"DOM（Document Object Model，文件物件模型）是瀏覽器把 HTML 轉成可操作的物件樹；querySelector 使用與 CSS 相同的 selector。",duration:"約 20–30 分鐘",objectives:["使用 querySelector 與 querySelectorAll。","把 CSS selector 知識套到 JavaScript。","處理 Element、NodeList 與 null。"],sections:[{type:"table",title:"DOM 選取 API",headers:["寫法","回傳","找不到時"],rows:[["`document.querySelector(selector)`","第一個符合的 Element。","`null`"],["`document.querySelectorAll(selector)`","所有符合的靜態 NodeList。","空 NodeList，length 為 0"]],intro:null,note:null,firstColumnHeader:!0,caption:null},{type:"code",title:"CSS 與 JS 使用同一組 selector",language:"css",code:'#profile { border: 1px solid; }\n.card { padding: 1rem; }\n.card .title { font-weight: 700; }\ninput[name="email"] { width: 100%; }'},{type:"code",title:"JavaScript 選取",language:"javascript",code:'const profile = document.querySelector("#profile");\nconst cards = document.querySelectorAll(".card");\nconst titles = document.querySelectorAll(".card .title");\nconst email = document.querySelector(\'input[name="email"]\');\n\nfor (const card of cards) {\n  card.classList.add("is-ready");\n}'},{type:"callout",title:"querySelector 可能是 null",paragraphs:["selector 拼錯、元素還沒建立、script 太早執行，都可能讓結果是 null。接著執行 `null.textContent` 會出現 TypeError。先查 selector 與載入時機。"],bullets:[],tone:"warning"},{type:"exercise",title:"選對 API",task:"只要第一張 `.post-card` 與要取得全部 `.post-card`，各用哪一個 API？",checklist:[],answerText:"第一張用 querySelector('.post-card')；全部用 querySelectorAll('.post-card')，再用 for...of 逐一處理。"}],sources:[{label:"JavaScript DOM",url:"https://www.w3schools.com/js/js_htmldom.asp"},{label:"querySelector",url:"https://www.w3schools.com/jsref/met_document_queryselector.asp"},{label:"querySelectorAll",url:"https://www.w3schools.com/jsref/met_document_queryselectorall.asp"}]},{id:"js-dom-content",title:"修改文字、class 與屬性",shortTitle:"修改 DOM",summary:"選到元素後，常見工作是改文字、切換 class、設定 attribute；讓 CSS 負責外觀，JavaScript 只管理狀態。",duration:"約 20–30 分鐘",objectives:["使用 textContent。","使用 classList.add／remove／toggle／contains。","讀寫常見 property 與 attribute。"],sections:[{type:"code",title:"文字與狀態 class",language:"javascript",code:'const status = document.querySelector("#status");\nconst card = document.querySelector(".card");\n\nstatus.textContent = "已儲存";\ncard.classList.add("is-saved");\ncard.classList.toggle("is-highlighted");'},{type:"table",title:"常用 DOM 操作",headers:["寫法","用途","例子"],rows:[["`element.textContent`","讀寫純文字。","顯示姓名、狀態。"],["`element.classList.add()`","加入 class。","顯示成功樣式。"],["`remove()`","移除 class。","清除錯誤狀態。"],["`toggle()`","有則移除、無則加入。","展開、深色模式。"],["`contains()`","檢查 class 是否存在。","更新 aria-expanded。"],["`element.hidden`","讀寫 hidden 狀態。","顯示／隱藏提示。"],["`setAttribute()`","設定一般屬性。","aria-expanded、data-*。"]],intro:null,note:null,firstColumnHeader:!0,caption:null},{type:"code",title:"讓 CSS 處理外觀",language:"css",code:".notice { display:none; }\n.notice.is-visible { display:block; }\n.card.is-highlighted { outline:3px solid #176bff; }"},{type:"callout",title:"使用者輸入優先 textContent",paragraphs:["把表單文字顯示回頁面時，使用 textContent 會把內容當純文字；不要為了方便直接塞進 innerHTML。"],bullets:[],tone:"key"},{type:"exercise",title:"展開按鈕",task:"按鈕切換 panel 的 hidden，並同步 aria-expanded。提示：先得到 `const isOpen = !panel.hidden` 或在切換後讀取狀態。",checklist:[],answerCode:'button.addEventListener("click", () => {\n  panel.hidden = !panel.hidden;\n  button.setAttribute("aria-expanded", String(!panel.hidden));\n});',language:"javascript"}],sources:[{label:"DOM HTML",url:"https://www.w3schools.com/js/js_htmldom_html.asp"},{label:"DOM CSS",url:"https://www.w3schools.com/js/js_htmldom_css.asp"},{label:"classList",url:"https://www.w3schools.com/jsref/prop_element_classlist.asp"}]},{id:"js-events",title:"Events（事件）、target 與 currentTarget",shortTitle:"事件",summary:"事件讓程式回應 click、input、change、submit；listener 收到 event object，能知道事件來源與目前執行 listener 的元素。",duration:"約 20–30 分鐘",objectives:["用 addEventListener 綁定事件。","分辨 click、input、change、submit。","分辨 event.target 與 event.currentTarget。"],sections:[{type:"table",title:"常用事件",headers:["事件","何時發生","常見用途"],rows:[["`click`","按鈕或可點擊元素被啟動。","切換選單、加入卡片。"],["`input`","欄位值每次變動。","即時預覽、字數。"],["`change`","值確認改變。","select、checkbox 狀態。"],["`submit`","form 被提交。","統一驗證與處理。"]],intro:null,note:null,firstColumnHeader:!0,caption:null},{type:"code",title:"基本事件監聽",language:"javascript",code:'function updateGreeting(event) {\n  output.textContent = `你好，${event.currentTarget.value}`;\n}\n\nnameInput.addEventListener("input", updateGreeting);'},{type:"code",title:"target vs currentTarget",language:"html",code:'<button id="save-button"><span>儲存</span></button>'},{type:"code",title:"點到 span 時",language:"javascript",code:'saveButton.addEventListener("click", (event) => {\n  console.log(event.target);        // 可能是 span\n  console.log(event.currentTarget); // 一定是 saveButton\n});'},{type:"callout",title:"button 不要再包互動元素",paragraphs:["按鈕裡可以有 span 做文字或圖示，但不要再放 a、input 等可互動元素。事件處理通常以 currentTarget 代表綁定的控制項。"],bullets:[],tone:"tip"},{type:"exercise",title:"選事件",task:"姓名要即時顯示預覽、主題 select 選完後更新說明、form 統一驗證，分別選哪個事件？",checklist:[],answerText:"姓名 input 使用 input；select 可用 change；form 使用 submit。"}],sources:[{label:"JavaScript Events",url:"https://www.w3schools.com/js/js_events.asp"},{label:"DOM Event Listener",url:"https://www.w3schools.com/js/js_htmldom_eventlistener.asp"},{label:"Event target",url:"https://www.w3schools.com/jsref/event_target.asp"}]},{id:"js-forms",title:"讀取表單、驗證與 preventDefault",shortTitle:"表單互動",summary:"表單控制項以 `.value` 或 `.checked` 提供狀態；在 submit 事件中檢查資料，示範頁面則用 preventDefault 阻止真的送出。",duration:"約 20–30 分鐘",objectives:["讀取 input、select、textarea、datalist 與 checkbox。","使用 trim 做基本必填檢查。","在 submit listener 使用 preventDefault。"],sections:[{type:"table",title:"控制項讀值",headers:["控制項","JavaScript","結果"],rows:[["text／email／number input","`input.value`","字串；number 也先是字串。"],["select","`select.value`","選中 option 的 value。"],["textarea","`textarea.value`","多行文字字串。"],["checkbox","`checkbox.checked`","true／false。"],["datalist 搭配 input","`input.value`","使用者仍可能輸入清單外文字。"]],intro:null,note:null,firstColumnHeader:!0,caption:null},{type:"code",title:"提交與預覽",language:"javascript",code:'form.addEventListener("submit", (event) => {\n  event.preventDefault();\n\n  const name = nameInput.value.trim();\n  const topic = topicSelect.value;\n  const message = messageInput.value.trim();\n  const agreed = agreeCheckbox.checked;\n\n  if (name === "" || message === "" || !agreed) {\n    status.textContent = "請完成必填欄位並同意條款";\n    return;\n  }\n\n  previewName.textContent = name;\n  previewTopic.textContent = topic;\n  previewMessage.textContent = message;\n});'},{type:"callout",title:"前端驗證不是安全邊界",paragraphs:["本課的驗證用來改善操作體驗。真正送到伺服器時仍必須在伺服器端重新驗證；本靜態教材不教後端。"],bullets:[],tone:"warning"},{type:"callout",title:"required 仍然值得用",paragraphs:["HTML `required`、正確 input type 與 label 提供基本瀏覽器協助；JavaScript 再補客製訊息，不要把所有驗證都搬到 JS。"],bullets:[],tone:"tip"},{type:"lab",title:"聯絡表單預覽",instructions:"修改姓名、主題與留言後按送出，觀察右側預覽；再加上一個 checkbox 必填判斷。",starter:"<!doctype html><html lang=\"zh-Hant\"><head><meta charset=\"utf-8\"><style>body{font-family:system-ui;padding:20px;display:grid;gap:20px}@media(min-width:600px){body{grid-template-columns:1fr 1fr}}label{display:grid;gap:4px;margin-block:10px}input,select,textarea,button{font:inherit;padding:8px}</style></head><body><form id=\"contact\"><label>姓名<input id=\"name\" required></label><label>主題<select id=\"topic\"><option value=\"合作\">合作</option><option value=\"提問\">提問</option></select></label><label>留言<textarea id=\"message\" required></textarea></label><button>更新預覽</button><p id=\"status\"></p></form><article><h2 id=\"p-name\">訪客</h2><p id=\"p-topic\">尚未選擇</p><p id=\"p-message\">留言將顯示在這裡</p></article><script>const form=document.querySelector('#contact');const nameInput=document.querySelector('#name');const topic=document.querySelector('#topic');const message=document.querySelector('#message');form.addEventListener('submit',(event)=>{event.preventDefault();const name=nameInput.value.trim();if(name===''||message.value.trim()===''){document.querySelector('#status').textContent='請完成欄位';return}document.querySelector('#p-name').textContent=name;document.querySelector('#p-topic').textContent=topic.value;document.querySelector('#p-message').textContent=message.value.trim();document.querySelector('#status').textContent='預覽已更新'});<\/script></body></html>",height:440}],sources:[{label:"JavaScript Forms",url:"https://www.w3schools.com/js/js_validation.asp"},{label:"HTML Form Elements",url:"https://www.w3schools.com/html/html_form_elements.asp"},{label:"preventDefault",url:"https://www.w3schools.com/jsref/event_preventdefault.asp"}]},{id:"js-create-elements",title:"建立、加入與移除 DOM 元素",shortTitle:"新增元素",summary:"當資料筆數會變動，可用 createElement 建立節點、textContent 放文字、append 加到頁面；這比拼接使用者輸入的 HTML 更安全也更易讀。",duration:"約 20–30 分鐘",objectives:["使用 createElement 與 textContent。","使用 append／prepend 加入元素。","使用 remove 刪除元素。"],sections:[{type:"code",title:"建立文章卡片",language:"javascript",code:'function createPostCard(title, summary) {\n  const article = document.createElement("article");\n  article.className = "post-card";\n\n  const heading = document.createElement("h3");\n  heading.textContent = title;\n\n  const paragraph = document.createElement("p");\n  paragraph.textContent = summary;\n\n  const removeButton = document.createElement("button");\n  removeButton.type = "button";\n  removeButton.textContent = "刪除";\n  removeButton.addEventListener("click", () => article.remove());\n\n  article.append(heading, paragraph, removeButton);\n  return article;\n}\n\npostList.prepend(createPostCard("新文章", "今天完成 DOM 練習。"));'},{type:"table",title:"節點操作",headers:["方法","作用","初學用途"],rows:[["`document.createElement(tag)`","建立元素但尚未放入頁面。","article、li、button。"],["`parent.append(...)`","加入父元素最後。","新增留言。"],["`parent.prepend(...)`","加入父元素最前。","最新文章置頂。"],["`element.remove()`","從 DOM 移除自己。","刪除卡片。"]],intro:null,note:null,firstColumnHeader:!0,caption:null},{type:"callout",title:"先完成一個，再考慮抽象化",paragraphs:["初學時先能手動建立一張卡片，再包成 function。不要一開始就引入 template engine、framework 或複雜陣列方法。"],bullets:[],tone:"tip"},{type:"exercise",title:"技能 badge",task:"寫 `createBadge(label)`，建立 span、設定 className 與 textContent，最後回傳 span。",checklist:[],answerCode:'function createBadge(label) {\n  const badge = document.createElement("span");\n  badge.className = "badge";\n  badge.textContent = label;\n  return badge;\n}',language:"javascript"}],sources:[{label:"DOM Nodes",url:"https://www.w3schools.com/js/js_htmldom_nodes.asp"},{label:"createElement",url:"https://www.w3schools.com/jsref/met_document_createelement.asp"},{label:"Element remove",url:"https://www.w3schools.com/jsref/met_element_remove.asp"}]},{id:"js-debugging",title:"常見錯誤與系統化除錯",shortTitle:"除錯",summary:"除錯不是亂改到能跑；先重現問題、讀第一個錯誤、確認值與 selector，再做最小修正。",duration:"約 20–30 分鐘",objectives:["辨認 SyntaxError、ReferenceError、TypeError。","用 Console 與逐步檢查定位問題。","修正常見拼字、selector、型別與 listener bug。"],sections:[{type:"table",title:"常見錯誤表",headers:["現象／訊息","常見原因","先檢查"],rows:[["`SyntaxError`","括號、引號、逗號不完整。","錯誤行與上一行。"],["`ReferenceError: x is not defined`","變數拼錯、超出 scope、尚未宣告。","變數名稱與宣告位置。"],["`Cannot read properties of null`","querySelector 沒找到元素。","selector、DOM、defer。"],['結果 `"21"` 而非 `3`',"input.value 是字串。","使用 Number(value)。"],["點擊前函式就執行","listener 傳了 `save()`。","改傳 `save`。"],["只有第一張卡片改變","用 querySelector 而非 querySelectorAll。","需要單一還是全部。"],["迴圈最後 undefined","使用 `<= length`。","改為 `< length`。"]],intro:null,note:null,firstColumnHeader:!0,caption:null},{type:"text",title:"建議除錯順序",paragraphs:[],bullets:["穩定重現：知道按什麼、輸入什麼會出錯。","Console 先看第一個紅色錯誤與檔案行號。","在關鍵位置 `console.log()`：元素、輸入值、型別、條件結果。","把問題縮小：暫時註解無關程式。","只改一件事，重新整理並再次操作。","修好後移除多餘 log，測試空值與邊界。"],ordered:!0},{type:"code",title:"有意義的檢查",language:"javascript",code:'const button = document.querySelector("#save");\nconsole.log({ button });\n\nif (!button) {\n  console.error("找不到 #save，請檢查 HTML id");\n}'},{type:"exercise",title:"逐一找 bug",task:"下面程式至少有三個問題：selector 拼字、字串轉數字、listener 立刻執行。",checklist:[],answerCode:'const input = document.querySelector("#amount");\nconst button = document.querySelector("#calculate");\n\nfunction calculate() {\n  console.log(Number(input.value) + 1);\n}\n\nbutton.addEventListener("click", calculate);',language:"javascript"}],sources:[{label:"JavaScript Debugging",url:"https://www.w3schools.com/js/js_debugging.asp"},{label:"JavaScript Errors",url:"https://www.w3schools.com/js/js_errors.asp"}]},{id:"js-capstone",title:"綜合實作：讓履歷／部落格動起來",shortTitle:"互動專案",summary:"把基礎 JavaScript 組合成三個實用互動：藍色主題開關、表單即時預覽、建立與移除文章卡片。",duration:"約 60–90 分鐘",objectives:["以 event 與 DOM 串起使用者操作。","用 class／data attribute 交給 CSS 切換外觀。","完成靜態網站的基本互動與最終檢核。"],sections:[{type:"code",title:"主題開關",language:"javascript",code:'const themeToggle = document.querySelector("#theme-toggle");\n\nthemeToggle.addEventListener("change", (event) => {\n  document.body.classList.toggle("dark-theme", event.currentTarget.checked);\n});'},{type:"code",title:"即時姓名預覽",language:"javascript",code:'const nameInput = document.querySelector("#name");\nconst previewName = document.querySelector("#preview-name");\n\nnameInput.addEventListener("input", (event) => {\n  const value = event.currentTarget.value.trim();\n  previewName.textContent = value || "你的名字";\n});'},{
